<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#57606a"/>
    </marker>
    <marker id="mGrayS" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L7,4 L0,8 z" fill="#57606a"/>
    </marker>
    <marker id="mAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- title -->
  <text x="48" y="56" font-size="18" font-weight="600" fill="#24292f">SenseCAP M1 — system architecture</text>
  <text x="48" y="80" font-size="12" fill="#57606a">meshtastic-sx1302 · turns a Helium miner into a Meshtastic LoRa gateway</text>

  <!-- regions -->
  <rect x="40" y="118" width="230" height="415" rx="10" fill="#eff6ff" stroke="#d0d7de"/>
  <text x="56" y="148" font-size="16" font-weight="600" fill="#24292f">Clients</text>

  <rect x="352" y="108" width="565" height="468" rx="10" fill="#fefce8" stroke="#d0d7de"/>
  <text x="368" y="140" font-size="16" font-weight="600" fill="#24292f">SenseCAP M1</text>
  <text x="512" y="138" font-size="11.5" fill="#57606a">Raspberry Pi OS · Debian 13</text>

  <rect x="983" y="128" width="178" height="385" rx="10" fill="#f0fdf4" stroke="#d0d7de"/>
  <text x="999" y="158" font-size="15" font-weight="600" fill="#24292f">LoRa mesh</text>

  <!-- arrows: clients -> daemon -->
  <line x1="228" y1="213" x2="388" y2="246" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <line x1="228" y1="305" x2="388" y2="271" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <line x1="228" y1="397" x2="388" y2="296" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="258" y="221" font-size="11.5" fill="#57606a">TCP 4403</text>
  <text x="252" y="300" font-size="11.5" fill="#57606a">HTTPS 9443</text>
  <text x="238" y="390" font-size="11.5" fill="#57606a">TCP 4403</text>

  <!-- client boxes -->
  <rect x="58" y="180" width="170" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="74" y="216" font-size="14" font-weight="500" fill="#24292f">Phone App</text>
  <text x="74" y="236" font-size="11.5" fill="#57606a">Android · iOS</text>

  <rect x="58" y="272" width="170" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="74" y="308" font-size="14" font-weight="500" fill="#24292f">Web Browser</text>
  <text x="74" y="328" font-size="11.5" fill="#57606a">Web UI · :9443</text>

  <rect x="58" y="364" width="170" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="74" y="400" font-size="14" font-weight="500" fill="#24292f">CLI / Python</text>
  <text x="74" y="420" font-size="11.5" fill="#57606a">meshtastic CLI</text>

  <!-- daemon -->
  <rect x="393" y="175" width="200" height="158" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="1.6"/>
  <text x="407" y="213" font-size="17" font-weight="600" fill="#24292f">meshtasticd</text>
  <line x1="407" y1="228" x2="570" y2="226" stroke="#d0d7de" stroke-width="1"/>
  <text x="407" y="249" font-size="11.5" font-style="italic" fill="#57606a">this firmware — gateway daemon</text>
  <text x="407" y="278" font-size="12.5" fill="#24292f">TCP :4403</text>
  <text x="407" y="301" font-size="12.5" fill="#24292f">HTTPS :9443</text>

  <rect x="393" y="368" width="185" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="407" y="398" font-size="14.5" font-weight="500" fill="#24292f">install.sh</text>
  <text x="407" y="418" font-size="11.5" fill="#57606a">systemd · configs · autostart</text>

  <!-- WM1302 + radios -->
  <rect x="622" y="152" width="258" height="218" rx="10" fill="none" stroke="#d0d7de" stroke-dasharray="7 5"/>
  <text x="636" y="178" font-size="11.5" fill="#57606a">WM1302 module</text>

  <rect x="640" y="196" width="222" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="654" y="230" font-size="15.5" font-weight="600" fill="#24292f">SX1302</text>
  <text x="654" y="249" font-size="11.5" fill="#57606a">8-channel concentrator</text>

  <line x1="751" y1="260" x2="751" y2="282" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)" marker-start="url(#mGrayS)"/>
  <text x="764" y="276" font-size="11.5" fill="#57606a">LBT</text>

  <rect x="640" y="286" width="222" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="654" y="318" font-size="15.5" font-weight="600" fill="#24292f">SX1261</text>
  <text x="654" y="336" font-size="11.5" fill="#57606a">LBT listen-before-talk</text>

  <rect x="622" y="396" width="258" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="636" y="425" font-size="14.5" font-weight="500" fill="#24292f">STTS751</text>
  <text x="636" y="443" font-size="11.5" fill="#57606a">temperature sensor · I2C</text>

  <!-- buses -->
  <line x1="594" y1="242" x2="634" y2="224" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="596" y="222" font-size="11.5" fill="#57606a">SPI</text>
  <line x1="594" y1="322" x2="614" y2="420" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="612" y="384" font-size="11.5" fill="#57606a">I2C</text>
  <text x="655" y="553" font-size="11.5" fill="#57606a">Raspberry Pi CM4 + WM1302</text>

  <!-- RF link + antenna -->
  <line x1="864" y1="219" x2="974" y2="248" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#mAmber)"/>
  <text x="884" y="208" font-size="12.5" fill="#b45309">LoRa RF</text>
  <text x="878" y="288" font-size="11" fill="#57606a">863–928 MHz</text>
  <line x1="940" y1="215" x2="940" y2="190" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="940" cy="186" r="3.2" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <path d="M 946 184 Q 952 180 951 172" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 949 187 Q 957 180 955 168" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 934 184 Q 928 180 929 172" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 931 187 Q 923 180 925 168" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>

  <!-- mesh nodes -->
  <rect x="999" y="230" width="147" height="205" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1013" y="260" font-size="13" font-weight="600" fill="#24292f">Meshtastic nodes</text>
  <text x="1013" y="290" font-size="12.5" fill="#24292f">trackers</text>
  <text x="1013" y="316" font-size="12.5" fill="#24292f">sensors</text>
  <text x="1013" y="342" font-size="12.5" fill="#24292f">repeaters</text>
  <text x="1013" y="400" font-size="11" font-style="italic" fill="#57606a">off-grid</text>
  <text x="1013" y="464" font-size="11" fill="#57606a">works without cell</text>
</svg>

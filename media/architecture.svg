<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#57606a"/>
    </marker>
    <marker id="mGrayS" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L7,4 L0,8 z" fill="#57606a"/>
    </marker>
    <marker id="mAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- title -->
  <text x="48" y="56" font-size="18" font-weight="600" fill="#24292f">SenseCAP M1 — system architecture</text>
  <text x="48" y="80" font-size="12" fill="#57606a">meshtastic-sx1302 · turns a Helium miner into a Meshtastic LoRa gateway</text>

  <!-- regions: aligned top 100 / bottom 600 -->
  <rect x="40" y="100" width="220" height="500" rx="10" fill="#eff6ff" stroke="#d0d7de"/>
  <text x="56" y="130" font-size="16" font-weight="600" fill="#24292f">Clients</text>

  <rect x="360" y="100" width="560" height="500" rx="10" fill="#fefce8" stroke="#d0d7de"/>
  <text x="376" y="130" font-size="16" font-weight="600" fill="#24292f">SenseCAP M1</text>
  <text x="492" y="130" font-size="12" fill="#57606a">Raspberry Pi OS · Debian 13</text>

  <rect x="1010" y="100" width="150" height="500" rx="10" fill="#f0fdf4" stroke="#d0d7de"/>
  <text x="1025" y="130" font-size="15" font-weight="600" fill="#24292f">LoRa mesh</text>

  <!-- arrows: clients -> daemon (labels at midpoints, above lines) -->
  <line x1="240" y1="210" x2="378" y2="230" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <line x1="240" y1="330" x2="378" y2="262" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <line x1="240" y1="450" x2="378" y2="294" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="309" y="212" font-size="11.5" fill="#57606a" text-anchor="middle">TCP 4403</text>
  <text x="309" y="288" font-size="11.5" fill="#57606a" text-anchor="middle">HTTPS 9443</text>
  <text x="309" y="364" font-size="11.5" fill="#57606a" text-anchor="middle">TCP 4403</text>

  <!-- client boxes: equal size, evenly spaced, centered in region -->
  <rect x="60" y="170" width="180" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="212" font-size="15" font-weight="500" fill="#24292f">Phone App</text>
  <text x="76" y="234" font-size="11.5" fill="#57606a">Android · iOS</text>

  <rect x="60" y="290" width="180" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="332" font-size="15" font-weight="500" fill="#24292f">Web Browser</text>
  <text x="76" y="354" font-size="11.5" fill="#57606a">Web UI · :9443</text>

  <rect x="60" y="410" width="180" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="452" font-size="15" font-weight="500" fill="#24292f">CLI / Python</text>
  <text x="76" y="474" font-size="11.5" fill="#57606a">meshtastic CLI</text>

  <!-- daemon -->
  <rect x="380" y="170" width="200" height="180" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="1.6"/>
  <text x="394" y="210" font-size="17" font-weight="600" fill="#24292f">meshtasticd</text>
  <line x1="394" y1="224" x2="566" y2="224" stroke="#d0d7de" stroke-width="1"/>
  <text x="394" y="244" font-size="11.5" font-style="italic" fill="#57606a">this firmware — gateway daemon</text>
  <text x="394" y="274" font-size="12.5" fill="#24292f">TCP :4403</text>
  <text x="394" y="298" font-size="12.5" fill="#24292f">HTTPS :9443</text>

  <rect x="380" y="420" width="200" height="70" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="394" y="452" font-size="14.5" font-weight="500" fill="#24292f">install.sh</text>
  <text x="394" y="474" font-size="11.5" fill="#57606a">systemd · configs · autostart</text>

  <!-- WM1302 + radios -->
  <rect x="620" y="170" width="280" height="220" rx="10" fill="none" stroke="#d0d7de" stroke-dasharray="7 5"/>
  <text x="634" y="196" font-size="11.5" fill="#57606a">WM1302 module</text>

  <rect x="640" y="214" width="240" height="70" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="654" y="251" font-size="15.5" font-weight="600" fill="#24292f">SX1302</text>
  <text x="654" y="273" font-size="11.5" fill="#57606a">8-channel concentrator</text>

  <line x1="760" y1="288" x2="760" y2="310" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)" marker-start="url(#mGrayS)"/>
  <text x="772" y="303" font-size="11.5" fill="#57606a">LBT</text>

  <rect x="640" y="314" width="240" height="70" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="654" y="351" font-size="15.5" font-weight="600" fill="#24292f">SX1261</text>
  <text x="654" y="373" font-size="11.5" fill="#57606a">LBT listen-before-talk</text>

  <rect x="620" y="420" width="280" height="70" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="634" y="452" font-size="14.5" font-weight="500" fill="#24292f">STTS751</text>
  <text x="634" y="474" font-size="11.5" fill="#57606a">temperature sensor · I2C</text>

  <!-- buses -->
  <line x1="580" y1="245" x2="636" y2="240" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="592" y="232" font-size="11.5" fill="#57606a">SPI</text>
  <line x1="580" y1="320" x2="616" y2="448" stroke="#57606a" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="584" y="395" font-size="11.5" fill="#57606a">I2C</text>
  <text x="380" y="562" font-size="11.5" fill="#57606a">Raspberry Pi CM4 + WM1302</text>

  <!-- RF link + antenna -->
  <line x1="882" y1="245" x2="1020" y2="245" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#mAmber)"/>
  <text x="940" y="222" font-size="12.5" fill="#b45309" text-anchor="middle">LoRa RF</text>
  <text x="940" y="292" font-size="11" fill="#57606a" text-anchor="middle">863–928 MHz</text>
  <line x1="965" y1="200" x2="965" y2="175" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="965" cy="171" r="3.2" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <path d="M 971 169 Q 977 165 976 157" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 974 172 Q 982 165 980 153" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 959 169 Q 953 165 954 157" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 956 172 Q 948 165 950 153" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>

  <!-- mesh nodes -->
  <rect x="1025" y="170" width="120" height="320" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1037" y="202" font-size="12.5" font-weight="600" fill="#24292f">Meshtastic nodes</text>
  <text x="1037" y="240" font-size="12.5" fill="#24292f">trackers</text>
  <text x="1037" y="270" font-size="12.5" fill="#24292f">sensors</text>
  <text x="1037" y="300" font-size="12.5" fill="#24292f">repeaters</text>
  <text x="1037" y="455" font-size="11" font-style="italic" fill="#57606a">off-grid</text>
</svg>

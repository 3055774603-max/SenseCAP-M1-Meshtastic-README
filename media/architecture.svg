<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17233b"/>
      <stop offset="1" stop-color="#131f34"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#334155" fill-opacity="0.35"/>
    </pattern>
    <marker id="aSky" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#38bdf8"/>
    </marker>
    <marker id="aEm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#34d399"/>
    </marker>
    <marker id="aAm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#f59e0b"/>
    </marker>
    <marker id="aViF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <marker id="aViS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#34d399" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" fill="none" stroke="#334155" stroke-opacity="0.55"/>

  <!-- header -->
  <text x="40" y="47" font-size="19" font-weight="650" fill="#f1f5f9">SenseCAP M1 Meshtastic Gateway — System Architecture</text>
  <text x="1160" y="46" text-anchor="end" font-size="11.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">meshtastic-sx1302 · Meshtastic 2.7.x</text>
  <line x1="36" y1="70" x2="1164" y2="70" stroke="#334155" stroke-opacity="0.5"/>

  <!-- ============ IP SIDE ============ -->
  <rect x="36" y="92" width="214" height="464" rx="16" fill="#94a3b8" fill-opacity="0.05" stroke="#475569" stroke-opacity="0.55"/>
  <circle cx="54" cy="122" r="4" fill="#38bdf8"/>
  <text x="66" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7dd3fc">IP SIDE</text>

  <!-- client card: app -->
  <rect x="48" y="150" width="190" height="78" rx="12" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <rect x="62" y="171" width="36" height="36" rx="10" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/>
  <rect x="73" y="177" width="14" height="24" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  <circle cx="80" cy="197" r="1.3" fill="#38bdf8"/>
  <text x="110" y="184" font-size="13.5" font-weight="600" fill="#e2e8f0">Phone App</text>
  <text x="110" y="205" font-size="10.5" fill="#94a3b8">Android · iOS</text>

  <!-- client card: browser -->
  <rect x="48" y="250" width="190" height="78" rx="12" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <rect x="62" y="271" width="36" height="36" rx="10" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/>
  <circle cx="80" cy="289" r="9" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  <ellipse cx="80" cy="289" rx="4" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
  <line x1="71" y1="289" x2="89" y2="289" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="110" y="284" font-size="13.5" font-weight="600" fill="#e2e8f0">Web Browser</text>
  <text x="110" y="305" font-size="10.5" fill="#94a3b8">Web UI on :9443</text>

  <!-- client card: cli -->
  <rect x="48" y="350" width="190" height="78" rx="12" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <rect x="62" y="371" width="36" height="36" rx="10" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/>
  <rect x="70" y="381" width="20" height="16" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="393.5" text-anchor="middle" font-size="9" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt;_</text>
  <text x="110" y="384" font-size="13.5" font-weight="600" fill="#e2e8f0">Meshtastic CLI</text>
  <text x="110" y="405" font-size="10.5" fill="#94a3b8">python · console</text>

  <text x="143" y="470" text-anchor="middle" font-size="11" fill="#64748b">LAN or Internet</text>

  <!-- IP flow lines -->
  <path d="M250 189 C 320 189 330 240 396 240" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#aSky)"/>
  <path d="M250 289 C 320 289 330 272 396 272" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#aSky)"/>
  <path d="M250 389 C 320 389 330 304 396 304" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#aSky)"/>

  <!-- protocol pills -->
  <rect x="280" y="203" width="86" height="22" rx="11" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="323" y="217.5" text-anchor="middle" font-size="10.5" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TCP :4403</text>
  <rect x="274" y="269" width="98" height="22" rx="11" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="323" y="283.5" text-anchor="middle" font-size="10.5" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HTTPS :9443</text>
  <rect x="280" y="335" width="86" height="22" rx="11" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="323" y="349.5" text-anchor="middle" font-size="10.5" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TCP :4403</text>

  <!-- ============ SENSECAP M1 ============ -->
  <rect x="368" y="92" width="540" height="464" rx="16" fill="#94a3b8" fill-opacity="0.05" stroke="#475569" stroke-opacity="0.55"/>
  <circle cx="386" cy="122" r="4" fill="#34d399"/>
  <text x="398" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6ee7b7">SENSECAP M1</text>
  <text x="520" y="126" font-size="10.5" fill="#64748b">Raspberry Pi OS · Debian 13</text>

  <!-- software subpanel -->
  <rect x="384" y="150" width="212" height="296" rx="12" fill="#34d399" fill-opacity="0.04" stroke="#34d399" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <text x="396" y="172" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#6ee7b7">SOFTWARE</text>

  <!-- meshtasticd highlight card -->
  <g filter="url(#glow)">
    <rect x="396" y="200" width="188" height="150" rx="14" fill="url(#card)" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.4"/>
  </g>
  <rect x="410" y="214" width="112" height="20" rx="10" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="466" y="227.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="0.8" fill="#6ee7b7">THIS FIRMWARE</text>
  <text x="410" y="263" font-size="16" font-weight="650" fill="#f1f5f9">meshtasticd</text>
  <text x="410" y="281" font-size="10" fill="#94a3b8">Meshtastic gateway daemon</text>
  <line x1="410" y1="297" x2="570" y2="297" stroke="#94a3b8" stroke-opacity="0.25"/>
  <rect x="410" y="307" width="78" height="18" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="449" y="319.5" text-anchor="middle" font-size="9.5" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TCP :4403</text>
  <rect x="410" y="331" width="92" height="18" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="456" y="343.5" text-anchor="middle" font-size="9.5" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HTTPS :9443</text>

  <!-- install card -->
  <rect x="396" y="386" width="188" height="56" rx="12" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <text x="410" y="412" font-size="13.5" font-weight="600" fill="#e2e8f0">install.sh</text>
  <text x="410" y="430" font-size="10.5" fill="#94a3b8">configs · systemd · libs</text>

  <!-- hardware subpanel -->
  <rect x="612" y="150" width="280" height="296" rx="12" fill="#38bdf8" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <text x="624" y="172" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#7dd3fc">HARDWARE</text>

  <!-- WM1302 module -->
  <rect x="624" y="186" width="256" height="170" rx="12" fill="#38bdf8" fill-opacity="0.04" stroke="#7dd3fc" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <text x="636" y="206" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#7dd3fc">WM1302 MODULE</text>

  <rect x="636" y="222" width="232" height="56" rx="10" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <text x="650" y="248" font-size="14" font-weight="650" fill="#e2e8f0">SX1302</text>
  <text x="650" y="266" font-size="10.5" fill="#94a3b8">8-channel concentrator</text>

  <line x1="752" y1="278" x2="752" y2="300" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#aViF)" marker-start="url(#aViS)"/>
  <text x="766" y="293" font-size="9.5" fill="#c4b5fd">LBT</text>

  <rect x="636" y="302" width="232" height="44" rx="10" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <text x="650" y="324" font-size="13.5" font-weight="650" fill="#e2e8f0">SX1261</text>
  <text x="650" y="340" font-size="10.5" fill="#94a3b8">LBT listen-before-talk</text>

  <!-- STTS751 -->
  <rect x="636" y="376" width="232" height="56" rx="10" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <text x="650" y="402" font-size="13.5" font-weight="650" fill="#e2e8f0">STTS751</text>
  <text x="650" y="420" font-size="10.5" fill="#94a3b8">temperature sensor · I2C</text>

  <!-- bus lines -->
  <path d="M584 244 L635 244" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#aEm)"/>
  <rect x="588" y="235" width="36" height="18" rx="9" fill="#0b1220" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="606" y="247.5" text-anchor="middle" font-size="9.5" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SPI</text>

  <path d="M584 320 L635 404" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#aEm)"/>
  <rect x="587" y="359" width="34" height="18" rx="9" fill="#0b1220" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="604" y="371.5" text-anchor="middle" font-size="9.5" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">I2C</text>

  <!-- capability pills -->
  <rect x="520" y="496" width="82" height="22" rx="11" fill="#94a3b8" fill-opacity="0.08" stroke="#475569"/>
  <text x="561" y="511" text-anchor="middle" font-size="10" fill="#94a3b8">8 channels</text>
  <rect x="614" y="496" width="46" height="22" rx="11" fill="#94a3b8" fill-opacity="0.08" stroke="#475569"/>
  <text x="637" y="511" text-anchor="middle" font-size="10" fill="#94a3b8">LBT</text>
  <rect x="672" y="496" width="84" height="22" rx="11" fill="#94a3b8" fill-opacity="0.08" stroke="#475569"/>
  <text x="714" y="511" text-anchor="middle" font-size="10" fill="#94a3b8">always on</text>

  <!-- ============ RF LINK ============ -->
  <path d="M868 250 L1011 250" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#aAm)"/>
  <rect x="911" y="239" width="70" height="22" rx="11" fill="#0b1220" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="946" y="254" text-anchor="middle" font-size="10.5" fill="#fbbf24">LoRa RF</text>
  <text x="946" y="278" text-anchor="middle" font-size="10" fill="#f59e0b">863–928 MHz</text>

  <!-- ============ LORA MESH ============ -->
  <rect x="1000" y="92" width="164" height="464" rx="16" fill="#94a3b8" fill-opacity="0.05" stroke="#475569" stroke-opacity="0.55"/>
  <circle cx="1018" cy="122" r="4" fill="#fbbf24"/>
  <text x="1030" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#fcd34d">LoRa MESH</text>

  <rect x="1012" y="170" width="140" height="210" rx="14" fill="url(#card)" stroke="#475569" stroke-opacity="0.7"/>
  <rect x="1070" y="202" width="4" height="7" rx="1" fill="#fbbf24"/>
  <rect x="1078" y="197" width="4" height="12" rx="1" fill="#fbbf24"/>
  <rect x="1086" y="192" width="4" height="17" rx="1" fill="#fbbf24"/>
  <text x="1082" y="244" text-anchor="middle" font-size="12.5" font-weight="650" fill="#e2e8f0">Meshtastic nodes</text>
  <text x="1082" y="272" text-anchor="middle" font-size="11" fill="#94a3b8">trackers</text>
  <text x="1082" y="292" text-anchor="middle" font-size="11" fill="#94a3b8">sensors</text>
  <text x="1082" y="312" text-anchor="middle" font-size="11" fill="#94a3b8">repeaters</text>
  <rect x="1050" y="340" width="64" height="20" rx="10" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="1082" y="353.5" text-anchor="middle" font-size="9.5" fill="#fcd34d">off-grid</text>
  <text x="1082" y="410" text-anchor="middle" font-size="10" fill="#64748b">works without cell</text>

  <!-- ============ FOOTER ============ -->
  <line x1="36" y1="572" x2="1164" y2="572" stroke="#334155" stroke-opacity="0.5"/>
  <circle cx="44" cy="602" r="4" fill="#38bdf8"/>
  <text x="56" y="606" font-size="11" fill="#94a3b8">IP traffic · TCP / HTTPS</text>
  <circle cx="244" cy="602" r="4" fill="#34d399"/>
  <text x="256" y="606" font-size="11" fill="#94a3b8">internal bus · SPI / I2C</text>
  <line x1="434" y1="602" x2="460" y2="602" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="468" y="606" font-size="11" fill="#94a3b8">radio link · LoRa RF</text>
  <text x="1164" y="606" text-anchor="end" font-size="10.5" fill="#64748b">Raspberry Pi CM4 + WM1302 (SX1302 · SX1261)</text>
</svg>
